repos:
  # 1. Стандартные проверки (оставляем минимум)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace      # Удаляет лишние пробелы в конце строк
      - id: end-of-file-fixer         # Добавляет пустую строку в конце файла
      - id: check-yaml               # Проверяет синтаксис YAML-файлов
      - id: debug-statements         # Ищет забытые pdb.set_trace()

  # 2. Ruff — заменяет Black, Flake8, Isort, Pyupgrade и Add-trailing-comma
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.11
    hooks:
      - id: ruff             # Проверка ошибок и сортировка импортов
        args: [ --fix ]      # Исправляет ошибки автоматически
      - id: ruff-format      # Форматирование кода (замена Black)

  # 3. Mypy — проверка типов (через локальную установку Poetry)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        types: [python]
        pass_filenames: false
