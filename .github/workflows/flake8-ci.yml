name: Run Flake8

on:
  push:
    branches: [main, develop, Feature_homework_13_1]
  pull_request:
    branches: [main, develop]

jobs:
  flake8:
    runs-on: ubuntu-latest
    permissions:  # Добавили этот блок
      contents: read  # Только чтение репозитория
      packages: read  # Только чтение пакетов (если используется)
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: '3.x'  # Укажите нужную версию Python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exit-zero  # Для предотвращения падения workflow при ошибках
