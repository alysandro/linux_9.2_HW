name: Ruff

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      # 1. ОБЯЗАТЕЛЬНО: сначала клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем ruff
      - name: Install ruff
        run: pip install ruff

      # 3. Проверяем линтинг (без исправлений)
      - name: Run Ruff (Lint)
        run: ruff check .

      # 4. Проверяем форматирование (без изменений)
      - name: Run Ruff (Format check)
        run: ruff format --check .

      # 5. Исправляем всё автоматически
      - name: Fix and Format
        run: |
          ruff check --fix .
          ruff format .

      # 6. Коммитим изменения, если есть правки
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: fix lint and format with ruff"
          file_pattern: .
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: alysandro <163910150+alysandro@users.noreply.github.com>
          skip_dirty_check: false
