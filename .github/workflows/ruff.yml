name: Ruff
on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - name: Run Ruff (Lint)
      uses: astral-sh/ruff-action@v3
      with:
        args: "check ."
    - name: Run Ruff (Format check)
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check ."
    - name: Run Ruff (Fix and Format)
      run: |
        pip install ruff
        # Исправляем ошибки, которые можно исправить автоматически
        ruff check --fix .
        # Применяем форматирование
        ruff format .

    - name: Commit changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: fix lint and format with ruff"
