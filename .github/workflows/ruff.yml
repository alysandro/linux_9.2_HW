name: Ruff
on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - name: Run Ruff (Lint)
      uses: astral-sh/ruff-action@v3
      with:
        args: "check ."
    - name: Run Ruff (Format check)
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check ."
