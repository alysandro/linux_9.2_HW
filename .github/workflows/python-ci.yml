name: Python Poetry CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      # Кэширование зависимостей ускорит сборку в 2-3 раза
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      # Устанавливаем зависимости, только если кэш не найден
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Verify installation
        run: |
          poetry run python -c "import colorlog; import decouple; print('✅ Зависимости в порядке')"

      - name: Run Type Check (Mypy)
        run: poetry run mypy src

      - name: Run Tests with Coverage
        # Добавляем фиктивные переменные, если ваш код их требует через decouple
        env:
          API_KEY: "test_key"
          # Пути
          LOG_FILE: app.log
          DATA_DIR: data
          # Уровни логирования
          LOG_LEVEL_FILE: DEBUG
          LOG_LEVEL_CONSOLE: INFO
          # Ротация логов
          LOG_MAX_SIZE: 10485760
          LOG_BACKUP_COUNT: 5
          # Формат логов: color / json / plain
          LOG_FORMAT: color

        run: poetry run pytest --cov=src --cov-fail-under=80 --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
