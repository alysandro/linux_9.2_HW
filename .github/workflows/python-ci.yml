name: Python Poetry CI


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Remove old .venv
        run: rm -rf .venv

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Debug Check .venv existence
        run: ls -la | grep .venv || echo ".venv not found"

      - name: Debug Poetry version
        run: poetry --version

      - name: Debug List .venv after install
        run: ls -la .venv/

      - name: Verify dependencies
        run: |
          poetry show python-decouple
          poetry show colorlog

      - name: List all installed dependencies (for debugging)
        run: poetry show

      - name: Run Type Check (Mypy)
        run: poetry run mypy src

      - name: Run Tests with Coverage
        run: poetry run pytest --cov=src --cov-fail-under=80 --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
