name: Python Poetry CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: Install dependencies
        run: poetry install

      - name: Run Type Check (Mypy)
        run: poetry run mypy src

      - name: Run Tests with Coverage
        # Запускаем тесты один раз. Флаги берутся из pyproject.toml
        # или добавляются явно здесь для генерации xml.
        run: poetry run pytest --cov-report=xml

      - name: Upload Coverage Artifact
        # Сохраняем отчет как артефакт GitHub (можно скачать в UI)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

      - name: Upload coverage reports to Codecov
        # Отправляем отчет во внешнюю систему визуализации
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
