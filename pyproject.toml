[project]
# Основные метаданные проекта (стандарт PEP 621)
name = "linux-9-2-hw"
version = "0.1.0"
description = "Домашнее задание по курсу Linux"
authors = [{ name = "ALEXANDR_SH", email = "sandro.86@bk.ru" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [] # Основные зависимости приложения (библиотеки)

[tool.poetry]
# Настройки специфичные для пакетного менеджера Poetry
packages = [{ include = "src" }]

[tool.poetry.group.lint.dependencies]
# Инструменты для проверки качества кода и типов
ruff = "^0.9.2"    # Заменяет Black, isort и Flake8 (быстрый линтер на Rust)
mypy = "^1.14.0"   # Статический анализатор типов

[tool.poetry.group.dev.dependencies]
# Зависимости для разработки и тестирования
pytest = "^9.0.2"
covdefaults = "^2.3.0"
pytest-cov = "^7.0.0" # Добавьте это (актуальная версия на 2026)
poethepoet = "^0.40.0"

[build-system]
# Настройки сборки пакета
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Глобальные настройки Ruff (аналог настроек Black и Flake8)
line-length = 119
target-version = "py312"

[tool.ruff.lint]
# Настройки правил линтера
# E, W - ошибки и предупреждения стиля (pycodestyle)
# F - ошибки логики (pyflakes)
# I - сортировка импортов (isort)
# B - поиск вероятных багов (bugbear)
# UP - обновление синтаксиса до версии 3.12+ (pyupgrade)
select  = [
    "E",   # pycodestyle (ошибки стиля: пробелы, отступы)
    "W",   # pycodestyle (предупреждения: лишние пустые строки)
    "F",   # Pyflakes (критические ошибки: импортирован, но не используется; переменная не задана)
    "I",   # isort (автоматическая сортировка импортов)
    "B",   # flake8-bugbear (поиск логических ошибок и "плохих практик")
    "UP",  # pyupgrade (предлагает заменить старый синтаксис на новый, например Python 3.12+)
]
ignore = ["E501"] # Игнорировать длину строки, если вы не хотите, чтобы Ruff её проверял

[tool.ruff.lint.isort]
# Настройка поведения сортировки импортов
lines-after-imports = 2
force-sort-within-sections = true
known-first-party = ["src"]

[tool.ruff.format]
# Настройки автоматического форматирования кода
quote-style = "double" # Использовать двойные кавычки (как в Black)
indent-style = "space" # Использовать пробелы вместо табов
# skip-magic-trailing-comma = false
# Не убирать запятую в конце списка, если она там есть


[tool.mypy]
# Настройки строгой проверки типов
python_version = "3.12"
strict = true  # Включает все проверки (untyped defs, optional, и др.)
exclude = ["venv", ".venv", "build", "dist"]

[[tool.mypy.overrides]]
# Послабления для папки с тестами (в тестах типы часто не пишут строго)
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
# Настройки фреймворка для тестирования
testpaths = ["tests"]
# Добавляем флаги: --cov указывает на папку с кодом, --cov-report=term-missing покажет пропущенные строки в терминале
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test*"]
# addopts — это параметры по умолчанию:
# --cov=src: считать покрытие в папке src
# --cov-report=term-missing: выводить в консоль пропущенные строки
# --cov-report=xml: формировать файл coverage.xml для CI
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

#[tool.poetry.scripts]
## Быстрые команды для запуска через 'poetry run <command>'
## Проверить код на ошибки:
#lint = "ruff check src tests && mypy src"
## Исправить ошибки стиля и отформатировать:
#format = "ruff check --fix src tests && ruff format src tests"
#test = "pytest"

[tool.poe.tasks]
# Задача для проверки кода (Линтинг)
lint = [
  { cmd = "ruff check src tests" },
  { cmd = "mypy src" }
]

# Задача для исправления и форматирования
format = [
  { cmd = "ruff check --fix src tests" },
  { cmd = "ruff format src tests" }
]

# Задача для тестов
test = "pytest"
